[project]
name = "facechain"
version = "0.1.0"
description = "Consented face discovery and blockchain evidence verification demo"
requires-python = ">=3.11,<3.12"
dependencies = [
  "httpx>=0.27,<1",
  "opencv-python-headless>=4.10,<5",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "typer>=0.12,<1",
  "web3>=7.0,<8",
]

[project.optional-dependencies]
face = ["insightface>=0.7.3,<1", "onnxruntime>=1.19,<2"]
dev = ["mypy>=1.13,<2", "pytest>=8.3,<9", "pytest-cov>=5,<7", "respx>=0.21,<1", "ruff>=0.8,<1"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
facechain = "facechain.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --cov=facechain --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
